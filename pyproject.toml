[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flotation-collector-discovery"
version = "0.1.0"
description = "Synthetic QSPR/DFT pipeline for flotation collector screening"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src*"]